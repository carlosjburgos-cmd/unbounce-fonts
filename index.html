<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1628"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Game Day"><title>Game Day Scorekeeper</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b1628;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.wrap{max-width:520px;margin:auto;padding:16px 13px 30px}.heading{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 15px;font-size:18px;font-weight:900}.tag{font-size:11px;padding:7px 10px;background:#263a52;border-radius:30px;color:#c9dcf0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#1a2b44;border:1px solid #30415b;border-radius:19px;padding:14px 12px;text-align:center}.label{color:#b1c5da;font-size:12px;font-weight:800;letter-spacing:.1em}.name{margin:9px 0 5px;background:#0d1e33;border:1px solid #405571;color:white;width:100%;min-width:0;padding:10px 5px;border-radius:8px;font-size:15px;text-align:center;font-weight:800}.score{font-weight:950;font-size:76px;line-height:1.2;font-variant-numeric:tabular-nums;margin:9px 0 14px}.btn{appearance:none;border:0;border-radius:12px;color:white;background:#2869db;font-weight:850;cursor:pointer;min-height:51px;padding:11px;font-size:16px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.btn:active{filter:brightness(1.25)}.btn:disabled{opacity:.36;cursor:default}.green{background:#16834f}.outline{background:#263952;border:1px solid #4c6580}.full{width:100%;display:block}.stack{display:grid;gap:9px}.panel{background:#1a2b44;border:1px solid #30415b;border-radius:19px;margin-top:11px;padding:19px 15px;text-align:center}.section{font-size:12px;color:#b1c5da;font-weight:800;letter-spacing:.08em}.counter{display:flex;justify-content:center;gap:20px;align-items:center;margin:12px 0}.square{width:56px;height:52px;font-size:25px}.inning-number{font-size:57px;font-weight:950;min-width:75px;line-height:1.1}.half{font-weight:900;color:#f7c75a;font-size:13px;margin-top:5px}.dots{display:flex;gap:16px;justify-content:center;margin:18px 0}.dot{width:23px;height:23px;border:2px solid #667b95;border-radius:50%;background:#32445e}.dot.on{background:#f7c75a;border-color:#f7c75a}.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}.line{height:1px;background:#3c4e67;margin:20px 0}.hint{font-size:12px;color:#a3bbd4;margin:14px 0 0}.actions{margin-top:11px}.finish{margin-top:11px}.result{display:none;background:#1a2b44;border:1px solid #375979;border-radius:19px;margin-top:12px;padding:20px;text-align:center}.result.show{display:block}.result h2{margin:4px 0 8px;color:#ffd26c}.finalscore{font-size:23px;font-weight:850;line-height:1.5;margin-bottom:18px}.small{font-size:12px;color:#9eb2c6}.toast{min-height:18px;color:#9acdb8;font-size:12px;text-align:center;margin-top:8px}button:focus-visible,input:focus-visible{outline:3px solid #f7c75a;outline-offset:2px}
</style></head><body><main class="wrap"><header class="heading"><span>⚾ GAME DAY</span><span class="tag" id="status">LIVE SCORE</span></header><div class="grid"><section class="card"><div class="label">HOME</div><input aria-label="Home team name" class="name" id="homeName" value="Our Team"><div class="score" id="homeScore">0</div><div class="stack"><button class="btn green" data-action="homePlus">＋ RUN</button><button class="btn outline" data-action="homeMinus">− RUN</button></div></section><section class="card"><div class="label">AWAY</div><input aria-label="Away team name" class="name" id="awayName" value="Visitors"><div class="score" id="awayScore">0</div><div class="stack"><button class="btn green" data-action="awayPlus">＋ RUN</button><button class="btn outline" data-action="awayMinus">− RUN</button></div></section></div><section class="panel"><div class="section">INNING</div><div class="counter"><button class="btn outline square" data-action="prevHalf" aria-label="Previous half inning">−</button><div><div class="inning-number" id="inning">1</div><div class="half" id="half">▲ TOP</div></div><button class="btn square" data-action="nextHalf" aria-label="Next half inning">＋</button></div><div class="line"></div><div class="section">OUTS</div><div class="dots" id="outsDots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="duo"><button class="btn outline" data-action="outMinus">− OUT</button><button class="btn" data-action="outPlus">＋ OUT</button></div><p class="hint">Third out automatically advances to the next half-inning.</p></section><div class="duo actions"><button class="btn outline" id="undo" data-action="undo">↶ Undo</button><button class="btn outline" data-action="newGame">↻ New Game</button></div><button class="btn green full finish" id="endButton" data-action="end">⚑ End Game & Results</button><section class="result" id="result"><div style="font-size:32px">🏆</div><h2 id="winner">Winner</h2><div class="finalscore" id="finalScore"></div><div class="stack"><button class="btn green full" data-action="share">↗ Share Final Score</button><button class="btn outline full" data-action="copy">Copy Results</button><button class="btn outline full" data-action="edit">Edit Score</button></div></section><div class="toast" id="toast" role="status"></div><p class="small" style="text-align:center">Scores save automatically on this device when browser storage is available.</p></main>
<script>
(function(){'use strict';
var KEY='game-day-scorekeeper-v1';
var game={home:0,away:0,inning:1,half:'Top',outs:0,ended:false,homeName:'Our Team',awayName:'Visitors'};
var history=[];
function el(id){return document.getElementById(id)}
function safeSave(){try{localStorage.setItem(KEY,JSON.stringify({game:game,history:history.slice(-100)}))}catch(e){}}
try{var old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.game){game=Object.assign(game,old.game);history=Array.isArray(old.history)?old.history:[]}}catch(e){}
function teamName(key,fallback){return (game[key]||'').trim()||fallback}
function resultText(){var home=teamName('homeName','Home'),away=teamName('awayName','Away');var winner=game.home===game.away?'Tie Game':(game.home>game.away?home:away)+' Wins!';return '⚾ FINAL SCORE\n'+home+': '+game.home+'\n'+away+': '+game.away+'\n🏆 '+winner+'\n'+new Date().toLocaleDateString()}
function flash(text){el('toast').textContent=text}
function render(){el('homeScore').textContent=game.home;el('awayScore').textContent=game.away;el('inning').textContent=game.inning;el('half').textContent=(game.half==='Top'?'▲ TOP':'▼ BOTTOM');el('homeName').value=game.homeName;el('awayName').value=game.awayName;var dots=el('outsDots').children;for(var i=0;i<dots.length;i++)dots[i].className='dot'+(i<game.outs?' on':'');el('status').textContent=game.ended?'FINAL':'LIVE SCORE';el('undo').disabled=history.length===0;el('endButton').style.display=game.ended?'none':'block';el('result').className='result'+(game.ended?' show':'');var who=game.home===game.away?'Tie Game':(game.home>game.away?teamName('homeName','Home'):teamName('awayName','Away'))+' Wins!';el('winner').textContent=who;el('finalScore').textContent=teamName('homeName','Home')+' '+game.home+' — '+game.away+' '+teamName('awayName','Away');document.querySelectorAll('button[data-action]').forEach(function(b){var a=b.getAttribute('data-action');if(['homePlus','homeMinus','awayPlus','awayMinus','outPlus','outMinus','prevHalf','nextHalf'].indexOf(a)>=0)b.disabled=game.ended;if(a==='homeMinus')b.disabled=game.ended||game.home===0;if(a==='awayMinus')b.disabled=game.ended||game.away===0;if(a==='outMinus')b.disabled=game.ended||game.outs===0;if(a==='prevHalf')b.disabled=game.ended||(game.inning===1&&game.half==='Top')});safeSave()}
function snapshot(){history.push(Object.assign({},game));if(history.length>100)history.shift()}
function nextHalf(){game.outs=0;if(game.half==='Top')game.half='Bottom';else{game.half='Top';game.inning++}}
function prevHalf(){if(game.half==='Bottom')game.half='Top';else if(game.inning>1){game.half='Bottom';game.inning--}game.outs=0}
function action(a){flash('');if(a==='undo'){if(history.length){game=history.pop();render()}return}if(a==='newGame'){if(!confirm('Start a new game? This clears the current scores and history.'))return;game.home=0;game.away=0;game.inning=1;game.half='Top';game.outs=0;game.ended=false;history=[];render();return}if(a==='end'){if(!confirm('End this game and prepare the final results?'))return;snapshot();game.ended=true;render();return}if(a==='edit'){snapshot();game.ended=false;render();return}if(a==='share'){var t=resultText();if(navigator.share){navigator.share({title:'Baseball Final Score',text:t}).catch(function(){flash('Share cancelled or unavailable. Use Copy Results.')})}else{copy(t)}return}if(a==='copy'){copy(resultText());return}if(game.ended)return;var before=JSON.stringify(game);switch(a){case 'homePlus':game.home++;break;case 'homeMinus':game.home=Math.max(0,game.home-1);break;case 'awayPlus':game.away++;break;case 'awayMinus':game.away=Math.max(0,game.away-1);break;case 'outPlus':if(game.outs===2)nextHalf();else game.outs++;break;case 'outMinus':game.outs=Math.max(0,game.outs-1);break;case 'nextHalf':nextHalf();break;case 'prevHalf':prevHalf();break}if(JSON.stringify(game)!==before){history.push(JSON.parse(before));if(history.length>100)history.shift();render()}}
function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){flash('Results copied!')},function(){fallbackCopy(t)})}else fallbackCopy(t)}
function fallbackCopy(t){var box=document.createElement('textarea');box.value=t;box.style.position='fixed';box.style.opacity='0';document.body.appendChild(box);box.select();try{flash(document.execCommand('copy')?'Results copied!':'Select and copy the results below.')}catch(e){flash('Copy not supported in this browser.')}document.body.removeChild(box)}
document.addEventListener('click',function(e){var b=e.target.closest('button[data-action]');if(b&&!b.disabled)action(b.getAttribute('data-action'))});
['homeName','awayName'].forEach(function(id){el(id).addEventListener('input',function(){var key=id;game[key]=this.value;safeSave();if(game.ended){el('winner').textContent=game.home===game.away?'Tie Game':(game.home>game.away?teamName('homeName','Home'):teamName('awayName','Away'))+' Wins!';el('finalScore').textContent=teamName('homeName','Home')+' '+game.home+' — '+game.away+' '+teamName('awayName','Away')}})});
render();
})();
</script></body></html>
